<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="./css/GYN.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — PodGYN</title>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <h3>Login</h3>
            <form id="loginForm" novalidate>
                <div id="message" class="message"></div>
                <label>Empresa
                    <input type="text" name="Empresa" id="empresa" placeholder="Nome da empresa">
                </label>
                <label>Usuário
                    <input type="text" name="Usuario" id="usuario" placeholder="Nome de usuário">
                </label>
                <label>Senha
                    <div class="password-field">
                        <input type="password" name="Senha" id="senha" placeholder="Senha">
                        <button type="button" id="toggleSenha" class="toggle-password" aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </label>
                <button type="submit" id="entrar">Entrar</button>
            </form>
        </div>
    </div>
    <script>
        const empresaInput = document.getElementById('empresa');
        const usuarioInput = document.getElementById('usuario');
        const senhaInput = document.getElementById('senha');
        const toggleSenha = document.getElementById('toggleSenha');
        const loginForm = document.getElementById('loginForm');
        const messageBox = document.getElementById('message');

        const contas = [
            { empresa: 'PodGYN', usuario: 'Rezende', senha: '@@PodGYN@2026' },
            { empresa: 'admin', usuario: 'styfiller', senha: '1234' },
        ];

        function showMessage(text, isError = true) {
            messageBox.textContent = text;
            messageBox.className = isError ? 'message error' : 'message success';
        }

        function clearMessage() {
            messageBox.textContent = '';
            messageBox.className = 'message';
        }

        toggleSenha.addEventListener('click', () => {
            const mostraSenha = senhaInput.type === 'password';
            senhaInput.type = mostraSenha ? 'text' : 'password';
            toggleSenha.textContent = mostraSenha ? 'Ocultar' : 'Mostrar';
        });

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const empresa = empresaInput.value.trim();
            const usuario = usuarioInput.value.trim();
            const senha = senhaInput.value;

            if (!empresa || !usuario || !senha) {
                showMessage('Preencha empresa, usuário e senha.', true);
                return;
            }

            const conta = contas.find(c => c.empresa.toLowerCase() === empresa.toLowerCase());
            if (!conta) {
                showMessage('Empresa não cadastrada.', true);
                return;
            }

            if (conta.usuario.toLowerCase() !== usuario.toLowerCase()) {
                showMessage('Usuário incorreto.', true);
                return;
            }

            if (conta.senha !== senha) {
                showMessage('Senha incorreta.', true);
                return;
            }

            showMessage('Login realizado com sucesso!', false);
            setTimeout(() => {
                window.location.replace('/dashboard');
            }, 600);
        });
    </script>
</body>
</html>
